model = "{{CODEX_MODEL}}"
model_provider = "{{CODEX_MODEL_PROVIDER}}"
model_reasoning_effort = "{{CODEX_REASONING_EFFORT}}"
approval_policy = "never"
sandbox_mode = "read-only"
web_search = "disabled"
mcp_optional_startup_grace_ms = 0

[mcp_servers.playbook-retrospective]
required = true
command = "fastmcp"
args = ["run", "{{PACKAGE_ROOT}}/src/headless_codex/retrospective_mcp_server.py:mcp"]
enabled_tools = ["read_retrospective_document", "save_playbook_update"]
default_tools_approval_mode = "approve"
env_vars = ["PLAYBOOK_EXECUTION_TOKEN", "PLAYBOOK_EXECUTION_ID", "S3_EVIDENCE_BUCKET", "AWS_REGION", "AWS_DEFAULT_REGION", "AWS_PROFILE", "AWS_CONFIG_FILE", "AWS_SHARED_CREDENTIALS_FILE", "AWS_CONTAINER_CREDENTIALS_RELATIVE_URI", "AWS_CONTAINER_CREDENTIALS_FULL_URI", "AWS_CONTAINER_AUTHORIZATION_TOKEN", "AWS_CONTAINER_AUTHORIZATION_TOKEN_FILE"]
startup_timeout_sec = 30
tool_timeout_sec = 120

[mcp_servers.playbook-retrospective.env]
FASTMCP_LOG_LEVEL = "ERROR"
PLAYBOOK_EXECUTION_TOKEN = "{{PLAYBOOK_EXECUTION_TOKEN}}"
PLAYBOOK_EXECUTION_ID = "{{PLAYBOOK_EXECUTION_ID}}"

[model_providers.amazon-bedrock-runtime]
base_url = "{{BEDROCK_BASE_URL}}"

[model_providers.amazon-bedrock-runtime.auth]
command = "python"
args = ["-m", "headless_codex.bedrock_token"]
