name = "execution-operator"
sandbox_mode = "read-only"
approval_policy = "never"
web_search = "disabled"

[mcp_servers.playbook-execution]
command = "fastmcp"
args = ["run", "{{PACKAGE_ROOT}}/src/headless_codex/execution_mcp_server.py:mcp"]
enabled_tools = ["run_playbook_command", "wait_for_post_action_metrics", "wait_for_service_deployment", "record_step_outcome", "record_resolution"]
env_vars = ["PLAYBOOK_EXECUTION_TOKEN", "PLAYBOOK_EXECUTION_ID", "PLAYBOOK_APPROVED_STEP_IDS", "PLAYBOOK_APPROVED_SUCCESS_CRITERIA", "AWS_REGION", "AWS_DATA_PATH", "AWS_DEFAULT_REGION", "AWS_PROFILE", "AWS_CONFIG_FILE", "AWS_SHARED_CREDENTIALS_FILE", "AWS_CONTAINER_CREDENTIALS_RELATIVE_URI", "AWS_CONTAINER_CREDENTIALS_FULL_URI", "AWS_CONTAINER_AUTHORIZATION_TOKEN", "AWS_CONTAINER_AUTHORIZATION_TOKEN_FILE"]
startup_timeout_sec = 30
tool_timeout_sec = 1200

[mcp_servers.playbook-execution.env]
FASTMCP_LOG_LEVEL = "ERROR"
