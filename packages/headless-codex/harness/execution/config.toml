model = "{{CODEX_MODEL}}"
model_provider = "{{CODEX_MODEL_PROVIDER}}"
model_reasoning_effort = "{{CODEX_REASONING_EFFORT}}"
approval_policy = "never"
sandbox_mode = "read-only"
web_search = "disabled"

[mcp_servers.cloudwatch]
command = "uvx"
args = ["awslabs.cloudwatch-mcp-server"]
default_tools_approval_mode = "approve"
env_vars = ["AWS_REGION", "AWS_DEFAULT_REGION", "AWS_PROFILE", "AWS_CONFIG_FILE", "AWS_SHARED_CREDENTIALS_FILE", "AWS_CONTAINER_CREDENTIALS_RELATIVE_URI", "AWS_CONTAINER_CREDENTIALS_FULL_URI", "AWS_CONTAINER_AUTHORIZATION_TOKEN", "AWS_CONTAINER_AUTHORIZATION_TOKEN_FILE"]
startup_timeout_sec = 30
tool_timeout_sec = 120

[mcp_servers.cloudwatch.env]
FASTMCP_LOG_LEVEL = "ERROR"

[mcp_servers.playbook-execution]
command = "fastmcp"
args = ["run", "{{PACKAGE_ROOT}}/src/headless_codex/execution_mcp_server.py:mcp"]
enabled_tools = ["run_playbook_command", "record_step_outcome", "record_resolution"]
default_tools_approval_mode = "approve"
env_vars = ["PLAYBOOK_EXECUTION_TOKEN", "PLAYBOOK_EXECUTION_ID", "PLAYBOOK_APPROVED_STEP_IDS", "PLAYBOOK_APPROVED_SUCCESS_CRITERIA"]
startup_timeout_sec = 30
tool_timeout_sec = 360

[mcp_servers.playbook-execution.env]
FASTMCP_LOG_LEVEL = "ERROR"
PLAYBOOK_EXECUTION_TOKEN = "{{PLAYBOOK_EXECUTION_TOKEN}}"
PLAYBOOK_EXECUTION_ID = "{{PLAYBOOK_EXECUTION_ID}}"
PLAYBOOK_APPROVED_STEP_IDS = "{{PLAYBOOK_APPROVED_STEP_IDS}}"
PLAYBOOK_APPROVED_SUCCESS_CRITERIA = "{{PLAYBOOK_APPROVED_SUCCESS_CRITERIA}}"

[model_providers.amazon-bedrock-runtime]
base_url = "{{BEDROCK_BASE_URL}}"

[model_providers.amazon-bedrock-runtime.auth]
command = "python"
args = ["-m", "headless_codex.bedrock_token"]
