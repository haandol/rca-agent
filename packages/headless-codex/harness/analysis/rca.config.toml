model = "{{CODEX_MODEL}}"
model_provider = "{{CODEX_MODEL_PROVIDER}}"
model_reasoning_effort = "{{CODEX_REASONING_EFFORT}}"
approval_policy = "never"
sandbox_mode = "read-only"
web_search = "disabled"

[mcp_servers.aws-knowledge]
command = "fastmcp"
args = ["run", "https://knowledge-mcp.global.api.aws"]
default_tools_approval_mode = "approve"
env_vars = ["AWS_REGION", "AWS_DEFAULT_REGION", "AWS_PROFILE", "AWS_CONFIG_FILE", "AWS_SHARED_CREDENTIALS_FILE", "AWS_CONTAINER_CREDENTIALS_RELATIVE_URI", "AWS_CONTAINER_CREDENTIALS_FULL_URI", "AWS_CONTAINER_AUTHORIZATION_TOKEN", "AWS_CONTAINER_AUTHORIZATION_TOKEN_FILE"]
startup_timeout_sec = 30
tool_timeout_sec = 120

[mcp_servers.aws-knowledge.env]
FASTMCP_LOG_LEVEL = "ERROR"

[mcp_servers.cloudwatch]
command = "uvx"
args = ["awslabs.cloudwatch-mcp-server"]
default_tools_approval_mode = "approve"
env_vars = ["AWS_REGION", "AWS_DEFAULT_REGION", "AWS_PROFILE", "AWS_CONFIG_FILE", "AWS_SHARED_CREDENTIALS_FILE", "AWS_CONTAINER_CREDENTIALS_RELATIVE_URI", "AWS_CONTAINER_CREDENTIALS_FULL_URI", "AWS_CONTAINER_AUTHORIZATION_TOKEN", "AWS_CONTAINER_AUTHORIZATION_TOKEN_FILE"]
startup_timeout_sec = 30
tool_timeout_sec = 120

[mcp_servers.cloudwatch.env]
FASTMCP_LOG_LEVEL = "ERROR"

[mcp_servers.cloudtrail]
command = "uvx"
args = ["awslabs.cloudtrail-mcp-server"]
default_tools_approval_mode = "approve"
env_vars = ["AWS_REGION", "AWS_DEFAULT_REGION", "AWS_PROFILE", "AWS_CONFIG_FILE", "AWS_SHARED_CREDENTIALS_FILE", "AWS_CONTAINER_CREDENTIALS_RELATIVE_URI", "AWS_CONTAINER_CREDENTIALS_FULL_URI", "AWS_CONTAINER_AUTHORIZATION_TOKEN", "AWS_CONTAINER_AUTHORIZATION_TOKEN_FILE"]
startup_timeout_sec = 30
tool_timeout_sec = 120

[mcp_servers.cloudtrail.env]
FASTMCP_LOG_LEVEL = "ERROR"

[mcp_servers.github]
command = "github-mcp-server"
args = ["stdio"]
default_tools_approval_mode = "approve"
env_vars = ["GITHUB_PERSONAL_ACCESS_TOKEN"]
startup_timeout_sec = 30
tool_timeout_sec = 120

[mcp_servers.github.env]
GITHUB_READ_ONLY = "1"
GITHUB_TOOLSETS = "repos,pull_requests"

[mcp_servers.rca-progress]
command = "fastmcp"
args = ["run", "{{PACKAGE_ROOT}}/src/headless_codex/mcp_server.py:mcp"]
enabled_tools = ["save_analysis_artifact"]
default_tools_approval_mode = "approve"
env_vars = ["RCA_EXECUTION_TOKEN", "RCA_SESSION_ID", "RCA_CLAIM_TOKEN", "RCA_ATTEMPT", "DYNAMODB_TABLE_NAME", "AWS_REGION", "AWS_DEFAULT_REGION", "AWS_PROFILE", "AWS_CONFIG_FILE", "AWS_SHARED_CREDENTIALS_FILE", "AWS_CONTAINER_CREDENTIALS_RELATIVE_URI", "AWS_CONTAINER_CREDENTIALS_FULL_URI", "AWS_CONTAINER_AUTHORIZATION_TOKEN", "AWS_CONTAINER_AUTHORIZATION_TOKEN_FILE"]
startup_timeout_sec = 30
tool_timeout_sec = 120

[mcp_servers.rca-progress.env]
FASTMCP_LOG_LEVEL = "ERROR"
RCA_EXECUTION_TOKEN = "{{RCA_EXECUTION_TOKEN}}"
RCA_SESSION_ID = "{{RCA_SESSION_ID}}"
RCA_CLAIM_TOKEN = "{{RCA_CLAIM_TOKEN}}"
RCA_ATTEMPT = "{{RCA_ATTEMPT}}"

[model_providers.amazon-bedrock-runtime]
base_url = "{{BEDROCK_BASE_URL}}"

[model_providers.amazon-bedrock-runtime.auth]
command = "python"
args = ["-m", "headless_codex.bedrock_token"]
