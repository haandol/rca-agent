model = "{{CODEX_MODEL}}"
model_provider = "{{CODEX_MODEL_PROVIDER}}"
model_reasoning_effort = "{{CODEX_REASONING_EFFORT}}"
approval_policy = "never"
sandbox_mode = "read-only"
web_search = "disabled"

[features]
multi_agent = true

[agents]
max_threads = 2

[agents.rca-specialist]
description = "제공된 관측만 분석하고 RCA 산출물을 저장한다."
config_file = "{{CODEX_HOME}}/agents/rca-specialist-model-eval.toml"

[agents.report-specialist]
description = "RCA 결과로 평가용 리포트와 플레이북을 저장한다."
config_file = "{{CODEX_HOME}}/agents/report-specialist-model-eval.toml"

[model_providers.amazon-bedrock-runtime]
base_url = "{{BEDROCK_BASE_URL}}"

[model_providers.amazon-bedrock-runtime.auth]
command = "python"
args = ["-m", "headless_codex.bedrock_token"]
