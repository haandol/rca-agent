[app]
ns = "RcaAgent"
stage = "Dev"

[aws]
region = "us-east-1"

[alarm]
notificationEmail = "dongkyl@amazon.com"

[agent]
imageTag = "latest"

[healthcare]
imageTag = "latest"

[ccHeadless]
imageTag = "latest"

[remediation]
imageTag = "latest"
# 0 = 복구 에이전트 미배포(알림만), 1 = 자동 복구 활성화
desiredCount = 0

[storage]
evidenceBucket = "rca-agent-dev-evidence"
vectorBucket = "rca-agent-dev-vectors"

[table]
[table.rcaSession]
name = "RcaAgentDevRcaSession"

[tracing]
enabled = true
