packages:
  - 'packages/*'
overrides:
  'axios@<1.18.0': ^1.18.0
  '@babel/plugin-transform-modules-systemjs@<7.29.4': ^7.29.4
  # Transitive via nuxt/nitropack; 2.x has no patched release, so lift it to 5.x.
  'brace-expansion@<5.0.9': ^5.0.9
  # Transitive via jest (@istanbuljs/load-nyc-config); patched within the 3.x line.
  'js-yaml@<3.15.1': ^3.15.1
  # Transitive via postcss (nuxt/vite); patched within the 3.x line.
  'nanoid@<3.3.18': ^3.3.18
allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  esbuild: true
  nx: true
  unrs-resolver: true
  vue-demi: true
